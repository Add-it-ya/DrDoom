<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DrDoom</title>

<!--
  Model output is never assigned to innerHTML.

  Plain fields go through textContent, which cannot introduce markup. The postmortem is
  markdown and has to become html, so it goes through DOMPurify first. That matters here
  more than in most applications: the text originates from a language model reading a
  document corpus, so a poisoned document could ask the model to emit a script tag, and
  this page is same-origin with the approval endpoint. Retrieval -> model -> operator
  browser -> privileged action is a real chain, and this is where it is cut.

  The rule for anyone editing this page or app.js: if the value came from the api, it is
  either textContent or it is sanitised. There is no third option. The script and styles
  live in their own files so the Content Security Policy the service sends can refuse
  anything inline (src/drdoom/api/headers.py).

  Both libraries are pinned by hash. A CDN serving anything but these exact bytes gets
  its script refused, and without the sanitiser the postmortem is not rendered at all:
  the page fails closed. Hashes are cdnjs's published sha512 for each file, checked
  against the bytes served. Changing a version means changing its hash.
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"
        integrity="sha512-xeUh+KxNyTufZOje++oQHstlMQ8/rpyzPuM+gjMFYK3z5ILJGE7l2NvYL+XfliKURMpBIKKp1XoPN/qswlSMFA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"
        integrity="sha512-jB0TkTBeQC9ZSkBqDhdmfTv1qdfbWpGE72yJ/01Srq6hEzZIz2xkz1e57p9ai7IeHMwEG7HpzG6NdptChif5Pg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>DrDoom</h1>
    <p>Detect an incident, diagnose it against real documentation, propose a fix, and hold it at a human gate.</p>
  </header>

  <div class="controls">
    <button id="run" class="primary">Investigate a disturbed window</button>
    <button id="runCalm">Investigate a calm window</button>
    <label for="key">API key</label>
    <input id="key" type="password" placeholder="X-API-Key" autocomplete="off">
  </div>

  <section class="recent">
    <div class="recent-head">
      <h2>Recent incidents</h2>
      <button id="loadRecent">Load</button>
    </div>
    <ol class="incidents" id="incidents"></ol>
  </section>

  <div class="stages">
    <div class="stage" id="s-triage"><span class="name">Triage</span><div class="body" id="b-triage"></div></div>
    <div class="stage" id="s-diagnose"><span class="name">Diagnosis</span><div class="body" id="b-diagnose"></div></div>
    <div class="stage" id="s-remediate"><span class="name">Remediation</span><div class="body" id="b-remediate"></div></div>
    <div class="stage" id="s-execute"><span class="name">Outcome</span><div class="body" id="b-execute"></div></div>
  </div>

  <div class="gate" id="gate" hidden>
    <h2>Approval required</h2>
    <div class="body" id="gateBody"></div>
    <div class="actions">
      <button class="approve" id="approve">Approve</button>
      <button class="reject" id="reject">Reject</button>
    </div>
  </div>

  <div class="report" id="report" hidden></div>
  <div class="log" id="log"></div>
</div>

<script src="app.js"></script>
</body>
</html>
