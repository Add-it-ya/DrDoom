# One command to run the whole thing locally.
#
#   DRDOOM_API_KEYS="you:pick-a-key" GROQ_API_KEY=... docker compose up
#
# State is a named volume rather than a bind mount, so suspended investigations survive
# a container restart without depending on the host's filesystem layout.

services:
  api:
    build: .
    image: drdoom:local
    ports:
      - "8000:8000"
    environment:
      # Required to approve a remediation. An unset key ring accepts nobody, which is the
      # correct default for a missing configuration.
      DRDOOM_API_KEYS: ${DRDOOM_API_KEYS:-}
      # The default provider. Without it the service still starts and the agents degrade:
      # retrieved documentation instead of a summary, and an empty plan held for a human.
      # /health reports "degraded" until a key is set.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DRDOOM_LOG_LEVEL: ${DRDOOM_LOG_LEVEL:-INFO}
      DRDOOM_ENVIRONMENT: production
    volumes:
      - drdoom-state:/app/state
    restart: unless-stopped

volumes:
  drdoom-state:
