[project]
name = "drdoom"
version = "0.1.0"
description = "Autonomous incident response: detect, diagnose, propose, gate, report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aditya Raj", email = "skrair36@gmail.com" }]
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17,<23",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "scikit-learn>=1.5,<2",
    "torch>=2.4,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<8",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drdoom"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PTH", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]
markers = [
    "requires_dataset: needs the downloaded Server Machine Dataset on disk",
]
