[project]
name = "drdoom"
version = "0.1.0"
description = "Autonomous incident response: detect, diagnose, propose, gate, report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aditya Raj", email = "skrair36@gmail.com" }]
dependencies = [
    "fastapi>=0.115,<1",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "numpy>=2.0,<3",
    "openai>=1.50,<3",
    "optuna>=4.0,<5",
    "pandas>=2.2,<3",
    "pyarrow>=17,<23",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "scikit-learn>=1.5,<2",
    "sentence-transformers>=3.0,<6",
    "torch>=2.4,<3",
    "uvicorn[standard]>=0.32,<1",
    "xgboost>=2.1,<4",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<8",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drdoom"]

# Torch from the CPU-only index. The default wheels bundle CUDA libraries worth several
# gigabytes, and nothing in this project trains or infers on a GPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PTH", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]
markers = [
    "requires_dataset: needs the downloaded Server Machine Dataset on disk",
]
